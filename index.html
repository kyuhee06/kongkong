<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콩 심은 데 🫘 난다 - 실시간 가드닝</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; /* 브라우저 자체 스크롤 바를 숨김 */
            background-color: #749223; /* 섬 밖의 깊은 배경색 */
            font-family: 'Clear Sans', sans-serif;
            user-select: none;
        }

        /* 드래그 가능한 카메라 뷰포트 */
        #viewport {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }
        #viewport:active { cursor: grabbing; }

        /* 일정한 크기를 가진 가드닝 섬 (5000px x 5000px) */
        #island {
            position: absolute;
            width: 5000px;
            height: 5000px;
            background-color: #9cb945; /* 시안 속 초록 흙밭 색상 */
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            /* 중앙 격자 무늬 배경 (공간 실재감 부여) */
            background-image: radial-gradient(#8da73d 15%, transparent 15%);
            background-size: 40px 40px;
        }

        /* 고정 UI 레이어 */
        #ui-header {
            position: fixed; top: 20px; left: 20px;
            color: white; font-size: 26px; font-weight: bold;
            text-shadow: 2px 2px 0px #000; z-index: 10;
        }
        #ui-instruction {
            position: fixed; top: 20px; right: 20px;
            color: white; text-align: right;
            text-shadow: 1px 1px 0px #000; z-index: 10;
            font-size: 14px; line-height: 1.6;
            max-height: 80vh; overflow-y: auto;
            pointer-events: none; /* 클릭이 아래 밭으로 통과되도록 함 */
        }
        #history-list {
            margin-top: 15px; color: #d1ff36;
            font-weight: bold; list-style: none; padding: 0;
            pointer-events: auto; /* 히스토리 스크롤은 가능하게 함 */
        }

        /* 밭 및 오브젝트 배치 */
        .plot-container {
            position: absolute;
            display: flex; flex-direction: column; align-items: center;
            transform: translate(-50%, -50%);
        }
        .patch {
            width: 120px; height: 70px;
            background-color: #e3b265; border-radius: 50%;
            position: relative; display: flex; justify-content: center; align-items: center;
            border: 2px dashed #c59448; cursor: pointer;
            box-shadow: inset 0 5px 5px rgba(0,0,0,0.2);
        }
        .planted-image {
            max-width: 160px; max-height: 130px;
            object-fit: contain; border-radius: 6px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
            cursor: pointer; transition: transform 0.2s;
        }
        .planted-image:hover { transform: scale(1.05); }
        
        .signpost {
            margin-top: 8px; background-color: #c9843b; color: white;
            padding: 5px 14px; border-radius: 4px; font-size: 13px;
            border: 2px solid #a06222; box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            cursor: pointer; font-weight: bold;
        }

        /* 모달 스타일 */
        .modal {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%); width: 340px;
            background-color: #ca934a; border: 4px solid #8d5e27; border-radius: 20px;
            padding: 25px; box-shadow: 6px 6px 0px rgba(0,0,0,0.2); z-index: 100;
            color: white; text-align: center;
        }
        .modal-close { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 22px; color: #724617; }
        .modal input[type="text"] {
            width: 80%; padding: 10px; margin: 15px 0;
            border: 2px solid #8d5e27; border-radius: 8px;
            background-color: #f7e0bc; color: #5c3a14; font-weight: bold; text-align: center;
        }
        .modal button {
            background-color: #8d5e27; color: white; border: none;
            padding: 10px 24px; border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .modal button:hover { background-color: #724617; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 99; }
        
        /* 로딩 텍스트 스타일 */
        .loading-text { font-size: 12px; color: #fff3cc; display: none; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui-header">콩 심은 데 🫘 난다</div>
    <div id="ui-instruction">
        마우스로 드래그하여 섬을 둘러보세요.<br>
        빈 땅을 클릭해 밭을 일구고 사진을 심어보세요!
        <ul id="history-list"></ul>
    </div>

    <div id="viewport">
        <div id="island"></div>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeAllModals()"></div>

    <div class="modal" id="modal-till">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;">여기에 어떤 밭을 갈까요?</p>
        <input type="text" id="input-keyword" placeholder="예: 비행기, 고양이" maxlength="10">
        <br><button onclick="dbCreatePlot()">밭 갈기 완료</button>
    </div>

    <div class="modal" id="modal-plant">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;"><span id="target-keyword" style="color:#fff3cc;"></span> 심을 데</p>
        <p style="font-size:13px; margin:8px 0 15px 0; color:#fcecd2;">부합하는(혹은 엉뚱한) 이미지를 심어주세요.</p>
        <input type="file" id="input-file" accept="image/*" style="margin: 10px 0; color: #5c3a14;">
        <div class="loading-text" id="plant-loading">이미지 압축 및 심는 중...</div>
        <br><button id="btn-plant" onclick="dbPlantImage()">심기</button>
    </div>

    <div class="modal" id="modal-harvest">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;"><span id="harvest-keyword" style="color:#fff3cc;"></span> 심은 데</p>
        <input type="text" id="input-result" placeholder="실제로 무엇이 났나요?" maxlength="10"> <span style="font-weight:bold; font-size:16px;">났다!</span>
        <p style="font-size:12px; color:#fcecd2; margin
