<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콩 심은 데 🫘 난다 - 실시간 가드닝</title>
    
    <style>
        @font-face {
            font-family: 'RoundedFixedsys';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; 
            background: radial-gradient(circle, #428bca 0%, #22527a 100%);
            
            /* 2. 등록한 폰트 이름인 'RoundedFixedsys'를 여기에 적어줍니다 */
            font-family: 'RoundedFixedsys', sans-serif;
            
            user-select: none;
        }

        #viewport {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
        }

        #island {
            position: absolute; 
            /* 계산 오류를 방지하기 위해 섬 크기를 명확히 고정 */
            width: 4500px; height: 4500px;
            background-color: #9cb945; 
            border-radius: 600px; 
            border: 30px solid #e2cf90;
            box-shadow: 0 25px 70px rgba(0,0,0,0.4);
            cursor: grab;
        }
        #island:active { cursor: grabbing; }

        #ui-header {
            position: fixed; top: 20px; left: 20px;
            color: white; font-size: 26px; font-weight: bold;
            text-shadow: 2px 2px 0px #000; z-index: 10; pointer-events: none;
        }
        #ui-instruction {
            position: fixed; top: 20px; right: 20px;
            color: white; text-align: right; text-shadow: 1px 1px 0px #000;
            z-index: 10; font-size: 14px; line-height: 1.6; pointer-events: none; 
        }
        #history-list { margin-top: 15px; color: #d1ff36; font-weight: bold; list-style: none; padding: 0; pointer-events: auto; }

        .plot-container { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); z-index: 2; }
        .patch { 
            width: 120px; 
            height: 65px; 

            background-image: url('tilled.png'); 
            background-size: contain;      /* 이미지가 구겨지거나 잘리지 않고 틀 안에 쏙 들어가게 합니다 */
            background-repeat: no-repeat;  /* 이미지가 바둑판처럼 반복되어 나오는 것을 막습니다 */
            background-position: center;   /* 이미지를 한가운데 정렬합니다 */

            border: none;
            background-color: transparent; /* 배경을 투명하게 해서 PNG의 투명한 부분이 바다/섬에 잘 얹히게 합니다 */
            box-shadow: none;
    
    cursor: pointer; 
}
/* 부모 밭 (planted 상태) */
    .plot.planted {
          position: relative; /* 자식 이미지 정렬을 위한 기준점 설정 */
    /* 원본 밭 이미지는 이 div의 background-image로 유지되어야 함 */
}

/* 심어진 아이템 이미지 */
.plot.planted img {
    position: absolute; /* 정밀한 정렬을 위해 absolute 사용 */
    
    /* 1. 가로 정렬: 중앙 */
    left: 50%;
    
    /* [핵심 수정] 세로 정렬: 이미지의 아래끝선을 부모(밭)의 세로 기준 50%(중앙)에 배치 */
    bottom: 50%; 
    
    /* [핵심 수정] transform은 중복 없이 딱 한 번만 선언합니다. */
    /* 가로 중앙 정렬(-50%)만 유지하고, 세로는 이미 bottom: 50%로 중앙에 갔으니 건드리지 않습니다. */
    transform: translateX(-50%);
    
    /* 이미지 그림자: 비행기 모양대로, 아래로만, 반투명 */
    filter: drop-shadow(0 4px 2px rgba(0, 0, 0, 0.5)); 
    
    /* 모서리 곡률 제거 */
    border-radius: 0; 
    
    /* 이미지 크기 조절 */
    max-width: 210px; 
    height: 210px;
    object-fit: contain; /* 크기를 강제로 지정했을 때 이미지가 찌그러지지 않도록 방지 */
    
    /* 이미지가 밭 이미지 위로 얹히도록 z-index 설정 */
    z-index: 1; 
}
        .signpost {
            margin-top: 8px;
    
    /* 1. 크기 설정: 가로는 글자 길이에 맞게 늘어나고, 세로는 고정 */
            width: fit-content; 
            min-width: 60px;      /* 글자가 아주 짧아도 최소 이 크기는 유지 */
            height: 25px;          /* 푯말 높이 */
    
    /* 2. 텍스트 정중앙 정렬 및 가독성 확보 */
            display: flex;
            align-items: center;   
            justify-content: center;
            padding: 0 6px;       /* 글자 좌우로 생길 여백 (글자가 늘어나도 푯말이 예쁘게 유지됨) */
            box-sizing: border-box;

    /* 3. [도형 그리기 핵심] 보내주신 이미지 색상 및 입체감 반영 */
            background-color: #CF9640;       /* 푯말의 메인 밝은 갈색 */
            border-radius: 4px;             /* 부드럽게 라운딩된 모서리 */
    
    /* 외곽선과 하단 두꺼운 입체 층을 표현하기 위해 그림자(box-shadow)를 겹쳐서 씁니다 */
            box-shadow: 
            0 0 0 1.5px #AF7032,           /* 전체를 감싸는 진한 갈색 외곽선 */
            0 4px 0 0px #985A22;         /* 이미지 하단에 있던 6px 두께의 짙은 입체 갈색 층 */
    

    /* 4. 폰트 스타일링 */
           color: white;
            font-size: 16px;
            font-weight: normal;
     
            border: none; /* 기존 border 제거 */
            cursor: pointer;
} 

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; background-color: #ca934a; border: 4px solid #8d5e27; border-radius: 20px; padding: 25px; box-shadow: 6px 6px 0px rgba(0,0,0,0.2); z-index: 100; color: white; text-align: center; }
        .modal-close { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 22px; color: #724617; }
        .modal input[type="text"] { width: 80%; padding: 10px; margin: 15px 0; border: 2px solid #8d5e27; border-radius: 8px; background-color: #f7e0bc; color: #5c3a14; font-weight: bold; text-align: center; }
        .modal button { background-color: #8d5e27; color: white; border: none; padding: 10px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .modal button:hover { background-color: #724617; }
        .modal button:disabled { background-color: #aaaaaa; cursor: not-allowed; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 99; }
        .loading-text { font-size: 12px; color: #fff3cc; display: none; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui-header">콩 심은 데 🫘 난다</div>
    <div id="ui-instruction">
        마우스로 드래그하여 섬을 둘러보세요.<br>
        빈 땅을 클릭해 밭을 일구고 사진을 심어보세요!
        <ul id="history-list"></ul>
    </div>

    <div id="viewport">
        <div id="island"></div>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeAllModals()"></div>

    <div class="modal" id="modal-till">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;">여기에 어떤 밭을 갈까요?</p>
        <input type="text" id="input-keyword" placeholder="예: 비행기, 고양이" maxlength="10">
        <br><button id="btn-till" onclick="dbCreatePlot()">밭 갈기 완료</button>
    </div>

    <div class="modal" id="modal-plant">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;"><span id="target-keyword" style="color:#fff3cc;"></span> 심을 데</p>
        <p style="font-size:13px; margin:8px 0 15px 0; color:#fcecd2;">부합하는(혹은 엉뚱한) 이미지를 심어주세요.</p>
        <input type="file" id="input-file" accept="image/*" style="margin: 10px 0; color: #5c3a14;">
        <div class="loading-text" id="plant-loading">이미지 압축 및 심는 중...</div>
        <br><button id="btn-plant" onclick="dbPlantImage()">심기</button>
    </div>

    <div class="modal" id="modal-harvest">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;"><span id="harvest-keyword" style="color:#fff3cc;"></span> 심은 데</p>
        <input type="text" id="input-result" placeholder="실제로 무엇이 났나요?" maxlength="10"> <span style="font-weight:bold; font-size:16px;">났다!</span>
        <p style="font-size:12px; color:#fcecd2; margin-top:5px;">수확 시 이미지가 저장되고 밭은 초기화됩니다.</p>
        <div class="loading-text" id="harvest-loading">수확 및 문장 기록 중...</div>
        <br><button id="btn-harvest" onclick="dbHarvestPlot()">수확하기</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://lbrsdsrpnhlqgghdxsxc.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicnNkc3JwbmhscWdnaGR4c3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzY2MzAsImV4cCI6MjA5NTM1MjYzMH0.9DBwOsWJ5Jup1_lMTUF-9eEbezoukj7BYPnRCuPrPmM"; 
        
        let dbClient = null;
        try {
            if (window.supabase) dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) { console.error("Supabase 로드 실패:", e); }
        
        const island = document.getElementById('island');
        const overlay = document.getElementById('overlay');
        
        let activePlotId = null;
        let clickCoord = { x: 0, y: 0 };

        const closeAllModals = () => {
            overlay.style.display = 'none';
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.querySelectorAll('.loading-text').forEach(t => t.style.display = 'none');
            
            document.getElementById('btn-till').disabled = false;
            document.getElementById('btn-plant').disabled = false; 
            document.getElementById('btn-harvest').disabled = false;
            
            document.getElementById('input-keyword').value = '';
            document.getElementById('input-file').value = '';
            document.getElementById('input-result').value = '';
        }

        const inputResult = document.getElementById('input-result');
        if (inputResult) {
            inputResult.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') e.preventDefault();
            });
        }

        // --- [수정] 경계선 잘림 현상을 해결한 드래그 한계 엔진 ---
        let isDragging = false;
        let camX = -1500, camY = -1500; 
        let startX, startY;
        let startScreenX = 0, startScreenY = 0;

        function updateCamera() {
            // 하단/우측 짤림 방지: 테두리(border 30px * 2)가 포함된 실제 섬 크기를 바탕으로 마지노선 계산
            const minX = window.innerWidth - island.offsetWidth;
            const minY = window.innerHeight - island.offsetHeight;
            
            if (camX > 0) camX = 0; if (camX < minX) camX = minX;
            if (camY > 0) camY = 0; if (camY < minY) camY = minY;
            
            island.style.left = camX + 'px';
            island.style.top = camY + 'px';
        }
        updateCamera();

        island.addEventListener('mousedown', (e) => {
            if (e.target !== island) return;
            isDragging = true;
            startScreenX = e.screenX;
            startScreenY = e.screenY;
            startX = e.clientX - camX;
            startY = e.clientY - camY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            camX = e.clientX - startX;
            camY = e.clientY - startY;
            updateCamera();
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const dragDistance = Math.sqrt(Math.pow(e.screenX - startScreenX, 2) + Math.pow(e.screenY - startScreenY, 2));
            if (dragDistance < 8 && e.target === island) {
                const rect = island.getBoundingClientRect();
                clickCoord.x = e.clientX - rect.left;
                clickCoord.y = e.clientY - rect.top;
                openModal('modal-till');
            }
        });

        island.addEventListener('touchstart', (e) => {
            if (e.target !== island) return;
            isDragging = true;
            const touch = e.touches[0];
            startScreenX = touch.screenX;
            startScreenY = touch.screenY;
            startX = touch.clientX - camX;
            startY = touch.clientY - camY;
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            camX = touch.clientX - startX;
            camY = touch.clientY - startY;
            updateCamera();
        }, {passive: true});

        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            const touch = e.changedTouches[0];
            const dragDistance = Math.sqrt(Math.pow(touch.screenX - startScreenX, 2) + Math.pow(touch.screenY - startScreenY, 2));
            if (dragDistance < 8 && e.target === island) {
                e.preventDefault(); 
                const rect = island.getBoundingClientRect();
                clickCoord.x = touch.clientX - rect.left;
                clickCoord.y = touch.clientY - rect.top;
                openModal('modal-till');
            }
        });

        function resizeImage(file, maxSide = 300) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > maxSide) { height *= maxSide / width; width = maxSide; } } 
                        else { if (height > maxSide) { width *= maxSide / height; height = maxSide; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 0.7);
                    }
                }
            });
        }

        async function dbCreatePlot() {
            const keyword = document.getElementById('input-keyword').value.trim();
            if (!keyword) return alert('키워드를 적어주세요!');
            
            const btn = document.getElementById('btn-till');
            if (btn.disabled) return; 
            btn.disabled = true;

            const plotTime = new Date().toISOString();
            const domId = 'plot_' + Date.now();
            
            renderPlotOnIsland({ id: domId, created_at: plotTime, x: clickCoord.x, y: clickCoord.y, keyword: keyword, status: 'till' });

            try {
                if(!dbClient) throw new Error("No DB");
                await dbClient.from('plots').insert([{ created_at: plotTime, x: clickCoord.x, y: clickCoord.y, keyword: keyword, status: 'till' }]);
            } catch(e) { console.log("로컬 반영"); }
            closeAllModals();
        }

        async function dbPlantImage() {
            const fileInput = document.getElementById('input-file');
            if (!fileInput.files || !fileInput.files[0]) return alert('사진을 골라주세요!');
            
            const btn = document.getElementById('btn-plant');
            if (btn.disabled) return;
            btn.disabled = true; 
            document.getElementById('plant-loading').style.display = 'block';
            
            const originalFile = fileInput.files[0];
            const compressedBlob = await resizeImage(originalFile, 300);

            const reader = new FileReader();
            reader.readAsDataURL(compressedBlob);
            reader.onloadend = async function() {
                const container = document.getElementById(activePlotId);
                if (!container) { closeAllModals(); return; }
                
                const currentSign = container.querySelector('.signpost').innerText;
                const dbTime = container.getAttribute('data-time');
                const base64ImageUrl = reader.result;

                renderPlotOnIsland({ 
                    id: activePlotId, 
                    created_at: dbTime,
                    x: parseFloat(container.style.left), 
                    y: parseFloat(container.style.top), 
                    keyword: currentSign, 
                    status: 'planted', 
                    image_url: base64ImageUrl 
                });

                try {
                    if(!dbClient) throw new Error("No DB");
                    
                    const { error } = await dbClient.from('plots')
                        .update({ status: 'planted', image_url: base64ImageUrl })
                        .eq('created_at', dbTime);
                        
                    if(error) console.error("업데이트 에러 로그:", error);
                } catch(e) { 
                    console.error("통신 장애:", e); 
                }
                closeAllModals();
            }
        }

        async function dbHarvestPlot() {
            const resultInput = document.getElementById('input-result').value.trim();
            if (!resultInput) return alert('실제 무엇이 열렸는지 작성해 주세요!');
            
            const btn = document.getElementById('btn-harvest');
            if (btn.disabled) return;
            btn.disabled = true; 
            
            const container = document.getElementById(activePlotId);
            if (!container) { closeAllModals(); return; }
            
            const keyword = container.querySelector('.signpost').innerText;
            const dbTime = container.getAttribute('data-time');
            const logText = `✨ ${keyword} 심은 데 ${resultInput} 났다!`;

            const list = document.getElementById('history-list');
            if (![...list.children].some(li => li.innerText === logText)) {
                const li = document.createElement('li');
                li.innerText = logText;
                list.insertBefore(li, list.firstChild);
            }
            
            container.remove();

            try {
                if(!dbClient) throw new Error("No DB");
                await dbClient.from('history').insert([{ sentence: logText }]);
                await dbClient.from('plots').delete().eq('created_at', dbTime);
            } catch(e) { console.log("로컬 제거"); }
            closeAllModals();
        }

        function renderPlotOnIsland(plot) {
            const domId = plot.id || 'plot_' + new Date(plot.created_at).getTime();
            let el = document.getElementById(domId);
            if (!el) {
                el = document.createElement('div'); el.className = 'plot-container'; el.id = domId;
                island.appendChild(el);
            }
            el.innerHTML = ''; el.style.left = plot.x + 'px'; el.style.top = plot.y + 'px';
            el.setAttribute('data-time', plot.created_at);
            
            if (plot.status === 'till') {
                const patch = document.createElement('div'); patch.className = 'patch';
                patch.onclick = (e) => { e.stopPropagation(); activePlotId = domId; document.getElementById('target-keyword').innerText = `'${plot.keyword}'`; openModal('modal-plant'); };
                el.appendChild(patch);
            } else if (plot.status === 'planted') {
                const img = document.createElement('img'); img.src = plot.image_url; img.className = 'planted-image';
                img.onclick = (e) => { e.stopPropagation(); activePlotId = domId; document.getElementById('harvest-keyword').innerText = `'${plot.keyword}'`; openModal('modal-harvest'); };
                el.appendChild(img);
            }
            
            const sign = document.createElement('div'); sign.className = 'signpost'; sign.innerText = plot.keyword;
            sign.onclick = (e) => {
                e.stopPropagation(); activePlotId = domId;
                if (plot.status === 'till') { document.getElementById('target-keyword').innerText = `'${plot.keyword}'`; openModal('modal-plant'); }
                else { document.getElementById('harvest-keyword').innerText = `'${plot.keyword}'`; openModal('modal-harvest'); }
            };
            el.appendChild(sign);
        }

        async function init() {
            try {
                if(!dbClient) return;
                const { data: plots } = await dbClient.from('plots').select('*');
                if (plots) plots.forEach(renderPlotOnIsland);
                const { data: logs } = await dbClient.from('history').select('*').order('created_at', { ascending: false }).limit(10);
                if (logs) {
                    const list = document.getElementById('history-list');
                    logs.forEach(log => { const li = document.createElement('li'); li.innerText = log.sentence; list.appendChild(li); });
                }
                
                dbClient.channel('public:plots').on('postgres_changes', { event: '*', schema: 'public', table: 'plots' }, payload => {
                    if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                        renderPlotOnIsland(payload.new);
                    } else if (payload.eventType === 'DELETE') {
                        const targetTime = payload.old.created_at;
                        document.querySelectorAll('.plot-container').forEach(el => {
                            if(el.getAttribute('data-time') === targetTime) el.remove();
                        });
                    }
                }).subscribe();
                
                dbClient.channel('public:history').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'history' }, payload => {
                    const list = document.getElementById('history-list');
                    if (![...list.children].some(li => li.innerText === payload.new.sentence)) {
                        const li = document.createElement('li');
                        li.innerText = payload.new.sentence;
                        list.insertBefore(li, list.firstChild);
                    }
                }).subscribe();
            } catch (err) { console.warn("Supabase 연결 해제:", err); }
        }

        function openModal(id) { 
            overlay.style.display = 'block'; 
            document.getElementById(id).style.display = 'block'; 
        }

        // 창 크기가 바뀔 때 한계선도 실시간 재계산 하도록 추가
        window.addEventListener('resize', updateCamera);

        init();
    </script>
</body>
</html>
