<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콩 심은 데 🫘 난다 - 실시간 가드닝</title>
    
    <style>
        @font-face {
            font-family: 'RoundedFixedsys';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; 
            background: radial-gradient(circle, #0168B5 0%, #004c85 100%);
            font-family: 'RoundedFixedsys', sans-serif;
            user-select: none;
        }

        #viewport {
            width: 100%; height: 100%;
            position: relative; overflow: hidden;
        }

        #island {
            position: absolute; 
            width: 4500px; height: 4500px;
            background-color: #A1B443; 
            border-radius: 600px; 
            border: 80px solid #FFD991;
            box-shadow: none;
            cursor: grab;
        }
        #island:active { cursor: grabbing; }

        #ui-header {
            position: fixed; top: 20px; left: 20px;
            color: white; font-size: 26px; font-weight: bold;
            text-shadow: 2px 2px 0px #000; z-index: 10; pointer-events: none;
        }
        #ui-instruction {
            position: fixed; top: 20px; right: 20px;
            color: white; text-align: right; text-shadow: 1px 1px 0px #000;
            z-index: 10; font-size: 14px; line-height: 1.6; pointer-events: none; 
        }
        
        #history-list { 
            margin-top: 15px; 
            list-style: none; 
            padding: 0; 
            pointer-events: auto; 
            max-height: calc(12 * 24px); 
            overflow-y: auto; 
            text-align: right;
        }
        #history-list li {
            font-size: 14px;
            line-height: 24px;
            font-weight: bold;
        }
        #history-list::-webkit-scrollbar { width: 6px; }
        #history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

        .plot-container { 
            position: absolute; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transform: translate(-50%, -50%); 
            z-index: 2; 
        }

        .patch { 
            width: 120px; 
            height: 65px; 
            background-image: url('tilled.png'); 
            background-size: contain; 
            background-repeat: no-repeat; 
            background-position: center; 
            border: none;
            background-color: transparent; 
            box-shadow: none;
            cursor: pointer; 
        }

        .planted-image {
            position: absolute; 
            left: 50%;
            bottom: 50%; 
            transform: translateX(-50%);
            filter: drop-shadow(0px 7px 0px rgba(127, 66, 8, 0.4)); 
            border-radius: 0; 
            width: 200px;           
            height: 200px;           
            object-fit: contain;    
            z-index: 1; 
        }

        .signpost {
            margin-top: 8px;
            width: fit-content; 
            min-width: 60px;      
            height: 25px;          
            display: flex;
            align-items: center;   
            justify-content: center;
            padding: 0 6px;      
            box-sizing: border-box;
            background-color: #CF9640;      
            border-radius: 4px;            
            box-shadow: 
                0 0 0 1.5px #AF7032,           
                0 4px 0 0px #985A22;         
            color: white;
            font-size: 16px;
            font-weight: normal;
            border: none; 
            cursor: pointer;
            z-index: 4;
        } 

        .modal { 
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 400px; 
            background-color: #CF9640; 
            border: 7px solid #AF7032; 
            border-radius: 25px; 
            padding: 44px; 
            box-shadow: 0px 15px 0px 0px rgba(0,0,0,0.2); 
            z-index: 100; 
            color: white; 
            text-align: center; 
            box-sizing: border-box;
        }

        .modal,
        .modal input, 
        .modal button,
        .modal label,
        .modal span,
        .modal p {
            font-family: 'RoundedFixedsys', sans-serif !important;
        }

        .modal p.main-text {
            font-weight: normal;         
            font-size: 18px;
            line-height: 25px;           
            margin: 0;                   
            word-break: keep-all;        
        }

        .modal p.sub-text {
            font-weight: normal;         
            font-size: 14px; 
            color: #fcecd2;
            line-height: 18px;            
            margin: 0;
            word-break: keep-all;
        }

        #modal-harvest p.sub-text {
            margin-top: 30px;
            margin-bottom: -10px !important; 
        }

        .modal-close { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            cursor: pointer; 
            width: 17px;
            height: 17px;
            background-image: url('Vector.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            text-indent: -9999px; 
            overflow: hidden;
        }

        .modal input[type="text"] { 
            width: 200px; 
            padding: 16px; 
            border: 0px solid #8d5e27; 
            border-radius: 10px; 
            background-color: #AF7032; 
            color: #ffffff; 
            font-size: 18px;
            font-weight: normal;         
            text-align: center; 
            box-sizing: border-box; 
        }

        .modal button.action-btn { 
            background-color: #985A22; 
            min-width: 140px;            
            width: auto;                 
            height: 43px;   
            color: white; 
            font-size: 18px; 
            border: none; 
            padding: 0px 16px;          
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: normal;         
            margin-top: 30px; 
        }
        .modal button.action-btn:hover { background-color: #5B310A; }
        .modal button.action-btn:disabled { background-color: #aaaaaa; cursor: not-allowed; }

        #btn-harvest {
            margin-top: 10px !important;
        }

        .harvest-input-row {
            display: flex;
            align-items: center;
            justify-content: center; 
            margin: 20px 0 0 0;
            padding-left: 0px;  
            padding-right: 0px; 
            box-sizing: border-box;
            width: 100%;
        }
        
        .harvest-input-row input[type="text"] {
            flex: none;
            width: 205px !important;
        }
        .harvest-input-row span.yield-text {
            font-size: 18px;
            color: white;
            margin-left: 27px; 
            white-space: nowrap;
        }

        #input-keyword {
            margin-top: 30px; 
            width: 260px !important;
        }

        #input-file {
            display: none;
        }

        .file-upload-label {
            display: inline-block;
            background-color: #AF7032; 
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: normal;         
            font-size: 14px;
            margin-top: 30px;      
            width: 260px;               
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .file-upload-label:hover {
            background-color: #985A22;  
        }

        .file-upload-label.selected {
            background-color: #5B310B !important;
            cursor: default;
        }
        .file-upload-label.selected:hover {
            background-color: #5B310B !important;
        }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 99; }

        .loading-text { 
            font-size: 14px; 
            color: #fff3cc; 
            display: none; 
            margin-top: 15px; 
            font-weight: normal;         
        }

        .modal input[type="text"]::placeholder { color: #583819; font-size: 18px; font-weight: normal; }
        .modal input[type="text"]::-webkit-input-placeholder { color: #583819; font-size: 18px; }
        .modal input[type="text"]::-moz-placeholder { color: #583819; font-size: 18px; }
    </style>
</head>
<body>

    <div id="ui-header">콩 심은 데 🫘 난다</div>
    <div id="ui-instruction">
        원하는 곳을 클릭하고 텃밭을 만들어 보세요.<br>
        비어있는 텃밭에 사진을 심어보세요.
        <ul id="history-list"></ul>
    </div>

    <div id="viewport">
        <div id="island"></div>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeAllModals()"></div>

    <div class="modal" id="modal-till">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p class="main-text">무엇을 위한 밭인가요?</p>
        <input type="text" id="input-keyword" placeholder="예: 비행기, 고양이" maxlength="10">
        <br><button id="btn-till" class="action-btn" onclick="dbCreatePlot()">완료</button>
    </div>
    
    <div class="modal" id="modal-plant">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p class="main-text"><span id="target-keyword" style="color:#ffffff;"></span>를 심으시겠습니까?</p>
        <label for="input-file" class="file-upload-label" id="label-file">
        이미지 파일 선택하기
        </label>
        <input type="file" id="input-file" accept="image/*">
        <div class="loading-text" id="plant-loading">사진을 심는 중...</div>
        <br><button id="btn-plant" class="action-btn" onclick="dbPlantImage()">심기</button>
    </div>

    <div class="modal" id="modal-harvest">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p class="main-text"><span id="harvest-keyword" style="color:#ffffff;"></span> 심은 데</p>
        
        <div class="harvest-input-row">
            <input type="text" id="input-result" placeholder="입력하기" maxlength="10">
            <span class="yield-text">났다!</span>
        </div>
        
        <p class="sub-text">수확 시 이미지가 저장되고 밭은 초기화됩니다.</p>
        <div class="loading-text" id="harvest-loading">수확 및 문장 기록 중...</div>
        <br><button id="btn-harvest" class="action-btn" onclick="dbHarvestPlot()">수확하기</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://lbrsdsrpnhlqgghdxsxc.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicnNkc3JwbmhscWdnaGR4c3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzY2MzAsImV4cCI6MjA5NTM1MjYzMH0.9DBwOsWJ5Jup1_lMTUF-9eEbezoukj7BYPnRCuPrPmM"; 
        
        let dbClient = null;
        try {
            if (window.supabase) dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch(e) { console.error("Supabase 로드 실패:", e); }
        
        const island = document.getElementById('island');
        const overlay = document.getElementById('overlay');
        
        let activePlotId = null;
        let clickCoord = { x: 0, y: 0 };
        let historyData = [];

        const closeAllModals = () => {
            overlay.style.display = 'none';
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.querySelectorAll('.loading-text').forEach(t => t.style.display = 'none');
            
            document.getElementById('btn-till').disabled = false;
            document.getElementById('btn-plant').disabled = false; 
            document.getElementById('btn-harvest').disabled = false;
            
            document.getElementById('input-keyword').value = '';
            document.getElementById('input-file').value = '';
            document.getElementById('input-result').value = '';

            const fileLabel = document.getElementById('label-file');
            if (fileLabel) {
                fileLabel.classList.remove('selected');
                fileLabel.innerText = "이미지 파일 선택하기";
            }
        }

        const fileInputEl = document.getElementById('input-file');
        const fileLabelEl = document.getElementById('label-file');
        if (fileInputEl && fileLabelEl) {
            fileInputEl.addEventListener('change', (e) => {
                if (fileInputEl.files && fileInputEl.files.length > 0) {
                    fileLabelEl.classList.add('selected');
                    fileLabelEl.innerText = "이미지 선택 완료";
                } else {
                    fileLabelEl.classList.remove('selected');
                    fileLabelEl.innerText = "이미지 파일 선택하기";
                }
            });
        }

        const inputResult = document.getElementById('input-result');
        if (inputResult) {
            inputResult.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') e.preventDefault();
            });
        }

        let isDragging = false;
        let camX = -1500, camY = -1500; 
        let startX, startY;
        let startScreenX = 0, startScreenY = 0;

        function updateCamera() {
            const margin = 60; 
            const minX = window.innerWidth - island.offsetWidth - margin;
            const minY = window.innerHeight - island.offsetHeight - margin;
            
            if (camX > margin) camX = margin; 
            if (camX < minX) camX = minX;
            if (camY > margin) camY = margin; 
            if (camY < minY) camY = minY;
            
            island.style.left = camX + 'px';
            island.style.top = camY + 'px';
        }
        updateCamera();

        island.addEventListener('mousedown', (e) => {
            if (e.target !== island) return;
            isDragging = true;
            startScreenX = e.screenX;
            startScreenY = e.screenY;
            startX = e.clientX - camX;
            startY = e.clientY - camY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            camX = e.clientX - startX;
            camY = e.clientY - startY;
            updateCamera();
        });

        window.addEventListener('mouseup', (e) => {
            if (!isDragging) return;
            isDragging = false;

            const dragDistance = Math.sqrt(Math.pow(e.screenX - startScreenX, 2) + Math.pow(e.screenY - startScreenY, 2));
            if (dragDistance < 8 && e.target === island) {
                const rect = island.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const clickY = e.clientY - rect.top;
                
                if (clickX < 80 || clickX > (4500 - 80) || clickY < 80 || clickY > (4500 - 80)) {
                    return; 
                }

                clickCoord.x = clickX;
                clickCoord.y = clickY;
                openModal('modal-till');
            }
        });

        island.addEventListener('touchstart', (e) => {
            if (e.target !== island) return;
            isDragging = true;
            const touch = e.touches[0];
            startScreenX = touch.screenX;
            startScreenY = touch.screenY;
            startX = touch.clientX - camX;
            startY = touch.clientY - camY;
        }, {passive: true});

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            camX = touch.clientX - startX;
            camY = touch.clientY - startY;
            updateCamera();
        }, {passive: true});

        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            
            const touch = e.changedTouches[0];
            const dragDistance = Math.sqrt(Math.pow(touch.screenX - startScreenX, 2) + Math.pow(touch.screenY - startScreenY, 2));
            if (dragDistance < 8 && e.target === island) {
                e.preventDefault(); 
                const rect = island.getBoundingClientRect();
                const clickX = touch.clientX - rect.left;
                const clickY = touch.clientY - rect.top;
                
                if (clickX < 80 || clickX > (4500 - 80) || clickY < 80 || clickY > (4500 - 80)) {
                    return;
                }

                clickCoord.x = clickX;
                clickCoord.y = clickY;
                openModal('modal-till');
            }
        });

        function resizeImage(file, maxSide = 300) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > maxSide) { height *= maxSide / width; width = maxSide; } } 
                        else { if (height > maxSide) { width *= maxSide / height; height = maxSide; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 0.7);
                    }
                }
            });
        }

        async function dbCreatePlot() {
            const keyword = document.getElementById('input-keyword').value.trim();
            if (!keyword) return alert('키워드를 적어주세요!');
            
            const btn = document.getElementById('btn-till');
            if (btn.disabled) return; 
            btn.disabled = true;

            const plotTime = new Date().toISOString();
            const domId = 'plot_' + Date.now();
            
            renderPlotOnIsland({ id: domId, created_at: plotTime, x: clickCoord.x, y: clickCoord.y, keyword: keyword, status: 'till' });

            try {
                if(!dbClient) throw new Error("No DB");
                await dbClient.from('plots').insert([{ created_at: plotTime, x: clickCoord.x, y: clickCoord.y, keyword: keyword, status: 'till' }]);
            } catch(e) { console.log("로컬 반영"); }
            closeAllModals();
        }

        async function dbPlantImage() {
            const fileInput = document.getElementById('input-file');
            if (!fileInput.files || !fileInput.files[0]) return alert('사진을 골라주세요!');
            
            const btn = document.getElementById('btn-plant');
            if (btn.disabled) return;
            btn.disabled = true;
            document.getElementById('plant-loading').style.display = 'block';
            
            const originalFile = fileInput.files[0];
            const compressedBlob = await resizeImage(originalFile, 300);

            const reader = new FileReader();
            reader.readAsDataURL(compressedBlob);
            reader.onloadend = async function() {
                const container = document.getElementById(activePlotId);
                if (!container) { closeAllModals(); return; }
                
                const currentSign = container.querySelector('.signpost').innerText;
                const dbTime = container.getAttribute('data-time');
                const base64ImageUrl = reader.result;

                renderPlotOnIsland({ 
                    id: activePlotId, 
                    created_at: dbTime,
                    x: parseFloat(container.style.left), 
                    y: parseFloat(container.style.top), 
                    keyword: currentSign, 
                    status: 'planted', 
                    image_url: base64ImageUrl 
                });

                try {
                    if(!dbClient) throw new Error("No DB");
                    const { error } = await dbClient.from('plots')
                        .update({ status: 'planted', image_url: base64ImageUrl })
                        .eq('created_at', dbTime);
                    if(error) console.error("업데이트 에러 로그:", error);
                } catch(e) { console.error("통신 장애:", e); }
                closeAllModals();
            }
        }

        async function dbHarvestPlot() {
            const resultInput = document.getElementById('input-result').value.trim();
            if (!resultInput) return alert('실제 무엇이 열렸는지 작성해 주세요!');
            
            const btn = document.getElementById('btn-harvest');
            if (btn.disabled) return;
            btn.disabled = true; 
            
            const container = document.getElementById(activePlotId);
            if (!container) { closeAllModals(); return; }
            
            const keyword = container.querySelector('.signpost').innerText;
            const dbTime = container.getAttribute('data-time');
            
            const attachedImg = container.querySelector('.planted-image');
            if (attachedImg && attachedImg.src) {
                try {
                    const downloadLink = document.createElement('a');
                    downloadLink.href = attachedImg.src;
                    downloadLink.download = `수확_${keyword}_${resultInput}.jpg`;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                } catch (err) {
                    console.error("디바이스 이미지 저장 중 오류:", err);
                }
            }
            
            const logItem = {
                id: 'log_' + Date.now(),
                keyword: keyword,
                result: resultInput,
                created_at: new Date().toISOString()
            };

            historyData.unshift(logItem);
            renderHistoryUI();
            
            container.remove();

            try {
                if(!dbClient) throw new Error("No DB");
                const logText = `🫘 ${keyword} 심은 데 ${resultInput} 났다!`;
                await dbClient.from('history').insert([{ sentence: logText, keyword: keyword, result: resultInput, created_at: logItem.created_at }]);
                await dbClient.from('plots').delete().eq('created_at', dbTime);
            } catch(e) { console.log("로컬 제거 및 기록"); }
            closeAllModals();
        }

        function renderHistoryUI() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';

            // 실시간 추가 등으로 인해 생성 날짜 정렬이 뒤섞이지 않도록 보장합니다.
            historyData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            // 최신 글 12개만 잘라서 화면에 렌더링
            const latestLogs = historyData.slice(0, 12);

            latestLogs.forEach(item => {
                const li = document.createElement('li');
                li.innerText = `🫘 ${item.keyword} 심은 데 ${item.result} 났다!`;
                
                if (item.keyword === item.result) {
                    li.style.color = '#9BFF7A';
                } else {
                    li.style.color = '#D16483';
                }
                list.appendChild(li);
            });
        }

        function renderPlotOnIsland(plot) {
            const domId = plot.id || 'plot_' + new Date(plot.created_at).getTime();
            let el = document.getElementById(domId);
            if (!el) {
                el = document.createElement('div'); el.className = 'plot-container'; el.id = domId;
                island.appendChild(el);
            }
            el.innerHTML = ''; el.style.left = plot.x + 'px'; el.style.top = plot.y + 'px';
            el.setAttribute('data-time', plot.created_at);
            
            const patch = document.createElement('div'); 
            patch.className = 'patch';
            el.appendChild(patch);

            if (plot.status === 'till') {
                patch.onclick = (e) => { e.stopPropagation(); activePlotId = domId; document.getElementById('target-keyword').innerText = `'${plot.keyword}'`; openModal('modal-plant'); };
            } 
            else if (plot.status === 'planted') {
                patch.onclick = (e) => { e.stopPropagation(); activePlotId = domId; document.getElementById('harvest-keyword').innerText = `'${plot.keyword}'`; openModal('modal-harvest'); };
                
                const img = document.createElement('img'); 
                img.src = plot.image_url; 
                img.className = 'planted-image';
                img.onclick = (e) => { e.stopPropagation(); activePlotId = domId; document.getElementById('harvest-keyword').innerText = `'${plot.keyword}'`; openModal('modal-harvest'); };
                el.appendChild(img);
            }
            
            const sign = document.createElement('div'); sign.className = 'signpost'; sign.innerText = plot.keyword;
            sign.onclick = (e) => {
                e.stopPropagation(); activePlotId = domId;
                if (plot.status === 'till') { document.getElementById('target-keyword').innerText = `'${plot.keyword}'`; openModal('modal-plant'); }
                else { document.getElementById('harvest-keyword').innerText = `'${plot.keyword}'`; openModal('modal-harvest'); }
            };
            el.appendChild(sign);
        }

        async function init() {
            try {
                if(!dbClient) return;
                const { data: plots } = await dbClient.from('plots').select('*');
                if (plots) plots.forEach(renderPlotOnIsland);
                
                const { data: logs } = await dbClient.from('history').select('*').order('created_at', { ascending: false });
                if (logs) {
                    historyData = logs.map(log => {
                        const cleanSentence = log.sentence.replace('🫘 ', '').replace('✨ ', '');
                        const match = cleanSentence.match(/(.*) 심은 데 (.*) 났다!/);
                        return {
                            id: 'log_' + new Date(log.created_at).getTime(),
                            keyword: log.keyword || (match ? match[1].trim() : '공통'),
                            result: log.result || (match ? match[2].trim() : '알수없음'),
                            created_at: log.created_at
                        };
                    });
                    renderHistoryUI();
                }
                
                dbClient.channel('public:plots').on('postgres_changes', { event: '*', schema: 'public', table: 'plots' }, payload => {
                    if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
                        renderPlotOnIsland(payload.new);
                    } else if (payload.eventType === 'DELETE') {
                        const targetTime = payload.old.created_at;
                        document.querySelectorAll('.plot-container').forEach(el => {
                            if(el.getAttribute('data-time') === targetTime) el.remove();
                        });
                    }
                }).subscribe();
                
                dbClient.channel('public:history').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'history' }, payload => {
                    const cleanSentence = payload.new.sentence.replace('🫘 ', '').replace('✨ ', '');
                    const match = cleanSentence.match(/(.*) 심은 데 (.*) 났다!/);
                    const realKeyword = payload.new.keyword || (match ? match[1].trim() : '공통');
                    const realResult = payload.new.result || (match ? match[2].trim() : '알수없음');

                    // 실시간 등록 시 중복 뼈대 및 구조 오작동 완벽 방지
                    if (!historyData.some(h => h.created_at === payload.new.created_at)) {
                        historyData.unshift({
                            id: 'log_' + new Date(payload.new.created_at).getTime(),
                            keyword: realKeyword,
                            result: realResult,
                            created_at: payload.new.created_at
                        });
                        renderHistoryUI();
                    }
                }).subscribe();
            } catch (err) { console.warn("Supabase 연결 해제:", err); }
        }

        function openModal(id) { 
            overlay.style.display = 'block'; 
            document.getElementById(id).style.display = 'block'; 
        }

        window.addEventListener('resize', updateCamera);
        init();
    </script>
</body>
</html>
