<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콩 심은 데 🫘 난다 - 실시간 가드닝</title>
    
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden; 
            background-color: #749223; 
            font-family: 'Clear Sans', sans-serif;
            user-select: none;
        }

        #viewport {
            width: 100%; height: 100%;
            position: relative; cursor: grab; overflow: hidden;
        }
        #viewport:active { cursor: grabbing; }

        #island {
            position: absolute; width: 5000px; height: 5000px;
            background-color: #9cb945; box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #ui-header {
            position: fixed; top: 20px; left: 20px;
            color: white; font-size: 26px; font-weight: bold;
            text-shadow: 2px 2px 0px #000; z-index: 10; pointer-events: none;
        }
        #ui-instruction {
            position: fixed; top: 20px; right: 20px;
            color: white; text-align: right; text-shadow: 1px 1px 0px #000;
            z-index: 10; font-size: 14px; line-height: 1.6; pointer-events: none; 
        }
        #history-list { margin-top: 15px; color: #d1ff36; font-weight: bold; list-style: none; padding: 0; pointer-events: auto; }

        .plot-container { position: absolute; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); z-index: 2; }
        .patch { width: 120px; height: 70px; background-color: #e3b265; border-radius: 50%; border: 2px dashed #c59448; cursor: pointer; box-shadow: inset 0 5px 5px rgba(0,0,0,0.2); }
        .planted-image { max-width: 160px; max-height: 130px; object-fit: contain; border-radius: 6px; box-shadow: 5px 5px 15px rgba(0,0,0,0.4); cursor: pointer; transition: transform 0.2s; }
        .planted-image:hover { transform: scale(1.05); }
        .signpost { margin-top: 8px; background-color: #c9843b; color: white; padding: 5px 14px; border-radius: 4px; font-size: 13px; border: 2px solid #a06222; box-shadow: 1px 2px 4px rgba(0,0,0,0.3); cursor: pointer; font-weight: bold; }

        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 340px; background-color: #ca934a; border: 4px solid #8d5e27; border-radius: 20px; padding: 25px; box-shadow: 6px 6px 0px rgba(0,0,0,0.2); z-index: 100; color: white; text-align: center; }
        .modal-close { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 22px; color: #724617; }
        .modal input[type="text"] { width: 80%; padding: 10px; margin: 15px 0; border: 2px solid #8d5e27; border-radius: 8px; background-color: #f7e0bc; color: #5c3a14; font-weight: bold; text-align: center; }
        .modal button { background-color: #8d5e27; color: white; border: none; padding: 10px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .modal button:hover { background-color: #724617; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 99; }
        .loading-text { font-size: 12px; color: #fff3cc; display: none; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="ui-header">콩 심은 데 🫘 난다</div>
    <div id="ui-instruction">
        마우스로 드래그하여 섬을 둘러보세요.<br>
        빈 땅을 클릭해 밭을 일구고 사진을 심어보세요!
        <ul id="history-list"></ul>
    </div>

    <div id="viewport">
        <div id="island"></div>
    </div>

    <div class="modal-overlay" id="overlay" onclick="closeAllModals()"></div>

    <div class="modal" id="modal-till">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;">여기에 어떤 밭을 갈까요?</p>
        <input type="text" id="input-keyword" placeholder="예: 비행기, 고양이" maxlength="10">
        <br><button onclick="dbCreatePlot()">밭 갈기 완료</button>
    </div>

    <div class="modal" id="modal-plant">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;"><span id="target-keyword" style="color:#fff3cc;"></span> 심을 데</p>
        <p style="font-size:13px; margin:8px 0 15px 0; color:#fcecd2;">부합하는(혹은 엉뚱한) 이미지를 심어주세요.</p>
        <input type="file" id="input-file" accept="image/*" style="margin: 10px 0; color: #5c3a14;">
        <div class="loading-text" id="plant-loading">이미지 압축 및 심는 중...</div>
        <br><button id="btn-plant" onclick="dbPlantImage()">심기</button>
    </div>

    <div class="modal" id="modal-harvest">
        <div class="modal-close" onclick="closeAllModals()">×</div>
        <p style="margin:0; font-weight:bold; font-size:16px;"><span id="harvest-keyword" style="color:#fff3cc;"></span> 심은 데</p>
        <input type="text" id="input-result" placeholder="실제로 무엇이 났나요?" maxlength="10"> <span style="font-weight:bold; font-size:16px;">났다!</span>
        <p style="font-size:12px; color:#fcecd2; margin-top:5px;">수확 시 이미지가 저장되고 밭은 초기화됩니다.</p>
        <div class="loading-text" id="harvest-loading">수확 및 문장 기록 중...</div>
        <br><button id="btn-harvest" onclick="dbHarvestPlot()">수확하기</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://lbrsdsrpnhlqgghdxsxc.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicnNkc3JwbmhscWdnaGR4c3hjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3NzY2MzAsImV4cCI6MjA5NTM1MjYzMH0.9DBwOsWJ5Jup1_lMTUF-9eEbezoukj7BYPnRCuPrPmM"; 
        
        let supabase = null;
        try {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch(e) {
            console.error("Supabase 생성 실패, 로컬 모드로 작동합니다:", e);
        }
        
        const viewport = document.getElementById('viewport');
        const island = document.getElementById('island');
        const overlay = document.getElementById('overlay');
        
        let activePlotId = null;
        let clickCoord = { x: 0, y: 0 };

        let isDragging = false;
        let camX = -1500, camY = -1500; 
        let startX, startY;
        let mouseDownX = 0, mouseDownY = 0;

        function updateCamera() {
            const minX = window.innerWidth - 5000, minY = window.innerHeight - 5000;
            if (camX > 0) camX = 0; if (camX < minX) camX = minX;
            if (camY > 0) camY = 0; if (camY < minY) camY = minY;
            island.style.left = camX + 'px';
            island.style.top = camY + 'px';
        }
        updateCamera();

        // 마우스와 터치를 모두 지원하는 공통 누르기 이벤트
        function onDown(e) {
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            const screenX = e.screenX || (e.touches && e.touches[0].screenX);
            const screenY = e.screenY || (e.touches && e.touches[0].screenY);

            if (e.target !== viewport && e.target !== island) return; 
            isDragging = true;
            mouseDownX = screenX;
            mouseDownY = screenY;
            startX = clientX - camX;
            startY = clientY - camY;
        }

        // 공통 움직임 이벤트
        function onMove(e) {
            if (!isDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            camX = clientX - startX;
            camY = clientY - startY;
            updateCamera();
        }

        // 공통 떼기 이벤트 (정밀 좌표 비교로 클릭 검출)
        function onUp(e) {
            if (!isDragging) return;
            isDragging = false;

            const changeEvent = e.changedTouches ? e.changedTouches[0] : e;
            const deltaX = Math.abs(changeEvent.screenX - mouseDownX);
            const deltaY = Math.abs(changeEvent.screenY - mouseDownY);

            // 8픽셀 미만 이동시 무조건 '클릭'으로 강제 인정
            if (deltaX < 8 && deltaY < 8) {
                const rect = island.getBoundingClientRect();
                clickCoord.x = changeEvent.clientX - rect.left;
                clickCoord.y = changeEvent.clientY - rect.top;
                openModal('modal-till');
            }
        }

        // 마우스 이벤트 등록
        viewport.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        // 모바일/터치 기기 이벤트 추가 등록
        viewport.addEventListener('touchstart', onDown, {passive: true});
        window.addEventListener('touchmove', onMove, {passive: true});
        window.addEventListener('touchend', onUp);

        function resizeImage(file, maxSide = 400) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) {
                            if (width > maxSide) { height *= maxSide / width; width = maxSide; }
                        } else {
                            if (height > maxSide) { width *= maxSide / height; height = maxSide; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', 0.85);
                    }
                }
            });
        }

        async function dbCreatePlot() {
            const keyword = document.getElementById('input-keyword').value.trim();
            if (!keyword) return alert('키워드를 적어주세요!');

            try {
                if(!supabase) throw new Error("No Supabase");
                const { error } = await supabase.from('plots').insert([{ x: clickCoord.x, y: clickCoord.y, keyword: keyword, status: 'till' }]);
                if (error) throw error;
            } catch(e) {
                console.log("로컬 브라우저 모드로 생성합니다.");
                renderPlotOnIsland({ id: 'local_' + Date.now(), x: clickCoord.x, y: clickCoord.y, keyword: keyword, status: 'till' });
            }
            closeAllModals();
        }

        async function dbPlantImage() {
            const fileInput = document.getElementById('input-file');
            if (!fileInput.files || !fileInput.files[0]) return alert('사진을 골라주세요!');
            
            document.getElementById('plant-loading').style.style.display = 'block';
            document.getElementById('btn-plant').disabled = true;

            const originalFile = fileInput.files[0];
            const compressedBlob = await resizeImage(originalFile, 400);

            try {
                if(!supabase) throw new Error("No Supabase");
                const fileName = `${activePlotId}_${Date.now()}.jpg`;
                const { error: storageError } = await supabase.storage.from('gardening-images').upload(fileName, compressedBlob, { contentType: 'image/jpeg' });
                if (storageError) throw storageError;

                const { data: urlData } = supabase.storage.from('gardening-images').getPublicUrl(fileName);
                await supabase.from('plots').update({ status: 'planted', image_url: urlData.publicUrl }).eq('id', activePlotId);
            } catch(e) {
                const reader = new FileReader();
                reader.readAsDataURL(compressedBlob);
                reader.onloadend = function() {
                    renderPlotOnIsland({ id: activePlotId, x: parseFloat(document.getElementById(activePlotId).style.left), y: parseFloat(document.getElementById(activePlotId).style.top), keyword: document.getElementById(activePlotId).querySelector('.signpost').innerText, status: 'planted', image_url: reader.result });
                }
            }
            closeAllModals();
        }

        async function dbHarvestPlot() {
            const resultInput = document.getElementById('input-result').value.trim();
            if (!resultInput) return alert('실제 무엇이 열렸는지 작성해 주세요!');

            const container = document.getElementById(activePlotId);
            const keyword = container.querySelector('.signpost').innerText;

            const list = document.getElementById('history-list');
            const li = document.createElement('li');
            li.innerText = `✨ ${keyword} 심은 데 ${resultInput} 났다!`;
            list.insertBefore(li, list.firstChild);

            try {
                if(!supabase) throw new Error("No Supabase");
                await supabase.from('history').insert([{ sentence: `✨ ${keyword} 심은 데 ${resultInput} 났다!` }]);
                await supabase.from('plots').delete().eq('id', activePlotId);
            } catch(e) {
                container.remove();
            }
            closeAllModals();
        }

        function renderPlotOnIsland(plot) {
            let el = document.getElementById(plot.id);
            if (!el) {
                el = document.createElement('div'); el.className = 'plot-container'; el.id = plot.id;
                island.appendChild(el);
            }
            el.innerHTML = ''; el.style.left = plot.x + 'px'; el.style.top = plot.y + 'px';

            if (plot.status === 'till') {
                const patch = document.createElement('div'); patch.className = 'patch';
                patch.onclick = (e) => { e.stopPropagation(); activePlotId = plot.id; document.getElementById('target-keyword').innerText = `'${plot.keyword}'`; openModal('modal-plant'); };
                el.appendChild(patch);
            } else {
                const img = document.createElement('img'); img.src = plot.image_url; img.className = 'planted-image';
                img.onclick = (e) => { e.stopPropagation(); activePlotId = plot.id; document.getElementById('harvest-keyword').innerText = `'${plot.keyword}'`; openModal('modal-harvest'); };
                el.appendChild(img);
            }

            const sign = document.createElement('div'); sign.className = 'signpost'; sign.innerText = plot.keyword;
            sign.onclick = (e) => {
                e.stopPropagation(); activePlotId = plot.id;
                if (plot.status === 'till') { document.getElementById('target-keyword').innerText = `'${plot.keyword}'`; openModal('modal-plant'); }
                else { document.getElementById('harvest-keyword').innerText = `'${plot.keyword}'`; openModal('modal-harvest'); }
            };
            el.appendChild(sign);
        }

        async function init() {
            // 모든 통신 에러 가능성에 예외 처리(try-catch) 적용
            try {
                if(!supabase) return;
                
                const { data: plots } = await supabase.from('plots').select('*');
                if (plots) plots.forEach(renderPlotOnIsland);

                const { data: logs } = await supabase.from('history').select('*').order('created_at', { ascending: false }).limit(10);
                if (logs) {
                    const list = document.getElementById('history-list');
                    logs.forEach(log => { const li = document.createElement('li'); li.innerText = log.sentence; list.appendChild(li); });
                }

                supabase.channel('public:plots').on('postgres_changes', { event: '*', schema: 'public', table: 'plots' }, payload => {
                    if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') { renderPlotOnIsland(payload.new); } 
                    else if (payload.eventType === 'DELETE') { const el = document.getElementById(payload.old.id); if (el) el.remove(); }
                }).subscribe();

                supabase.channel('public:history').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'history' }, payload => {
                    const list = document.getElementById('history-list'); const li = document.createElement('li');
                    li.innerText = payload.new.sentence; list.insertBefore(li, list.firstChild);
                }).subscribe();
            } catch (err) {
                console.warn("Supabase 연결 실패로 로컬 차단 해제:", err);
            }
        }

        function openModal(id) { overlay.style.display = 'block'; document.getElementById(id).style.display = 'block'; }
        function closeAllModals() {
            overlay.style.display = 'none';
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
            document.querySelectorAll('.loading-text').forEach(t => t.style.display = 'none');
            document.getElementById('btn-plant').disabled = false; document.getElementById('btn-harvest').disabled = false;
            document.getElementById('input-keyword').value = ''; document.getElementById('input-file').value = ''; document.getElementById('input-result').value = '';
        }

        init();
    </script>
</body>
</html>
